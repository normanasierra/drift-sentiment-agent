# Render blueprint for the Wakanda Forever web UI (FastAPI, server.py).
# One app, in the cloud (PC / Mac / phone). Deploy in one click:
#   https://render.com/deploy?repo=https://github.com/normanasierra/drift-sentiment-agent
# Render reads this file, then PROMPTS you for each `sync: false` secret (paste the
# values from your local .env). Nothing secret is ever stored in the repo.
services:
  - type: web
    name: drift-sentiment-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements-web.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      # --- Market data (paste your Massive/Polygon key) ---
      - key: MASSIVE_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      # --- App password gate (set one — the app is public otherwise) ---
      - key: WAKANDA_PASSWORD
        sync: false
      # --- Schwab positions + break-even (READ-ONLY). The refresh token is pushed
      #     here automatically by scripts/render_push_token.py after each re-auth,
      #     so you can leave SCHWAB_REFRESH_TOKEN blank at deploy time. ---
      - key: SCHWAB_APP_KEY
        sync: false
      - key: SCHWAB_APP_SECRET
        sync: false
      - key: SCHWAB_REFRESH_TOKEN
        sync: false
      # --- Optional: show today's MarketSnack sweeps (Unusual Activity) in the cloud ---
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      # --- Cloud market-morning reports (break-even + gamma walls). The /tasks/run
      #     endpoint runs them here 24/7, pinged by a free GitHub Actions cron, so
      #     delivery never depends on a PC being awake. Delivery creds (from your .env):
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: BRIEF_EMAIL_TO
        sync: false
      # --- Mobile delivery: Telegram (reliable, no quota). run_brief_local prefers
      #     Telegram whenever TELEGRAM_BOT_TOKEN is set; the cloud brief needs BOTH of
      #     these to reach Norman's phone. TELEGRAM_CHAT_ID is his numeric chat id. ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # --- CallMeBot/WhatsApp is RETIRED (quota died) — kept only as a dead fallback.
      #     Leave these blank; Telegram above is the live mobile channel. ---
      - key: CALLMEBOT_PHONE
        sync: false
      - key: CALLMEBOT_APIKEY
        sync: false
      # Shared secret guarding /tasks/run — set the SAME value as the GitHub repo
      # secret TASKS_KEY (Settings -> Secrets and variables -> Actions).
      - key: TASKS_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.6"
