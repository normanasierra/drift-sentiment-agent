name: Cloud brief (Render trigger)

# =============================================================================
# Reliable cloud delivery of the daily market brief when the PC can't fire the
# local Windows task. Two independent schedules + a manual button:
#
#   1. SUNDAY NIGHT (always)  cron '30 23 * * 0'  -> job=brief_force
#      The PC is powered OFF on weekends, so the local task can't run (and
#      WakeToRun can't wake a powered-off PC). This fires EVERY Sunday and is
#      NOT gated by the travel window. --force skips the closed-market guard.
#      Timing: target land = Sunday 22:00 AST (= Mon 02:00 UTC, AST=UTC-4, no DST).
#      GitHub's scheduled cron runs ~2.5h LATE, so we schedule ~2.5h earlier at
#      Sun 23:30 UTC. If it slips further, it lands in "la madrugada del lunes" —
#      acceptable per Norman.
#
#   2. WEEKDAYS DURING TRAVEL  cron '45 12 * * 1-5'  -> job=brief
#      When Norman travels the PC is off for days. This weekday run SELF-GATES to
#      the travel window below: outside it, it skips (the local PC brief handles
#      the day); inside it, it fires the cloud brief. GitHub delays it to ~11am AST
#      (a late brief beats no brief on travel days).
#
#   3. MANUAL ("Run workflow")  workflow_dispatch  -> job=brief_force by default
#      Always runs, regardless of day/window. Use it for the end-to-end test.
#
# >>> TRAVEL MODE: to arm/disarm, edit ONLY the two dates in WIN_START / WIN_END
#     in the run step below (ISO YYYY-MM-DD, inclusive). Nothing else to touch. <<<
#
# NOTE: the brief's break-even table needs a LIVE Schwab token (~7-day expiry).
# Re-auth on the PC before shutting it down for the weekend/trip so a fresh token
# syncs to Render (scripts/render_push_token.py). Delivery to mobile goes via
# Telegram (TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID must be set in Render's env).
# =============================================================================
on:
  schedule:
    - cron: '30 23 * * 0'     # Sun 23:30 UTC -> lands ~Sun 22:00 AST after GitHub's lag (job=brief_force)
    - cron: '45 12 * * 1-5'   # 12:45 UTC = 8:45am EDT weekdays -> ~11am AST fallback (job=brief)
    - cron: '30 20 * * 1-5'   # 20:30 UTC weekdays -> after the PC's 4:15pm close -> job=brief_close (realized P&L)
  workflow_dispatch:
    inputs:
      job:
        description: "Cloud job to trigger (brief_force = force-send regardless of day)"
        default: brief_force
        type: choice
        options:
          - brief_force
          - brief
          - brief_close

concurrency:
  group: cloud-brief
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Render cloud brief
        shell: bash
        env:
          TASKS_KEY: ${{ secrets.TASKS_KEY }}
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          DISPATCH_JOB: ${{ github.event.inputs.job }}
        run: |
          if [ -z "$TASKS_KEY" ]; then
            echo "TASKS_KEY repo secret is not set." >&2
            exit 1
          fi

          TODAY=$(date -u +%Y-%m-%d)

          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual run: force-send by default so an end-to-end test works any day.
            JOB="${DISPATCH_JOB:-brief_force}"
          elif [ "$SCHED" = "30 23 * * 0" ]; then
            # Sunday-night schedule: ALWAYS fire, force past the closed-market guard.
            JOB="brief_force"
          elif [ "$SCHED" = "30 20 * * 1-5" ]; then
            # Weekday AFTER-CLOSE schedule: the realized-P&L report (daily + Friday weekly). Its
            # distinct 'Cierre de Mercado' subject dedups it independently from the morning run.
            JOB="brief_close"
          else
            # Weekday morning schedule: ALWAYS fire — the cloud is the DAILY FALLBACK for when the PC
            # is off (Norman, 2026-10-13). run_brief_local self-skips closed-market days and, on
            # Render, skips when the PC already emailed today's brief (Gmail-inbox dedup), so it never
            # duplicates the on-time PC run. (No more travel-window gating.)
            JOB="brief"
          fi

          echo "Firing cloud job=$JOB at $(date -u '+%Y-%m-%d %H:%M UTC') (today=$TODAY, event=$EVENT, sched='$SCHED')"
          curl -fsS --max-time 120 --retry 5 --retry-all-errors --retry-delay 20 \
            "https://drift-sentiment-web.onrender.com/tasks/run?job=${JOB}&key=${TASKS_KEY}"
          echo ""
          echo "Triggered job=$JOB."
